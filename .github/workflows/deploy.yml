name: Deploy Website

on:
  push:
    tags:
      - "v*" #Скрипт запуститься только если pushить тег начинающийся с буквы "v" (v2.0.0-beta)
    # branches:
    #   - main   #скрипт запускается при каждом push

jobs:
  web-deploy:
    name: Deploy to KeyHelp via lftp
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sync files to Hosting
        run: |
          lftp -c "
          set ftp:ssl-force true; 
          set ftp:ssl-protect-data true; 
          set ssl:verify-certificate false; 
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ftp://${{ secrets.FTP_SERVER }}:21; 
          mirror -R --delete --verbose=3 --exclude=.git/ --exclude=.github/ ./ www/table-test2.gb6.ru/; 
          quit
          "
